          fillColor: '#fa5b13'
          fillOpacity: 1
          radius: 6
          color: 'black'
          opacity: 1
          weight: 2
      - condition: '"{{location_type}}" === "parks_and_recreation" && {{layer.focused}} === false && {{map.zoom}} >= 14 && {{map.zoom}} < 17'
        icon:
          iconUrl: /static/css/images/markers/parks_and_recreation.png
