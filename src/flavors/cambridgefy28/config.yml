activity:
  # Optional. Activity is supported by default. Set to false to disable.
  enabled: true
  # How often to refresh the activity list, in milliseconds.
  interval: 30000

place:
  adding_supported:
    from: '2024-08-26 00:00 -0400'   # Daylight savings begins mid-March
    until: '2024-10-02 00:00 -0400'  # and ends early-November.
  editors: cambridge-staff
  moderators: cambridge-staff
  response_name: _(idea)
  response_plural_name: _(ideas)
  # Labels for the buttons that toggle the map and list views
  add_button_label: _(Submit an idea)
  show_list_button_label: _(List All Ideas)
  show_map_button_label: _(Map All Ideas)
  title: _(Describe your idea)
  action_text: _(suggested)
  help_text: _(Ideas must be for <strong>capital</strong> projects – Please see the guidelines here)
  anonymous_name: _(Someone)
  submit_button_label: _(Share my idea)

  location_item_name: location
  city_wide_location_label: _(Multiple locations throughout the city)
  unset_location_label: _(Drag the map to a location for your idea.)

  items:
    - prompt: _(Is your idea for a specific location or the entire city?)
      name: city_wide
      sticky: false
      optional: false
      type: radiogroup
      attrs:
        - key: required
          value: true
      options:
      - label: _(A specific location)
        value: no
      - label: _(City-wide)
        value: yes
    - prompt: _(What is the title of your idea?)
      type: text
      name: title
      optional: false
      attrs:
        - key: placeholder
          value: _(My idea is called...)
        - key: size
          value: 30
        - key: maxlength
          value: 100
        - key: required
          value: true
    - prompt: _(Please describe your idea.)
      type: textarea
      name: description
      optional: false
      attrs:
        - key: placeholder
          value: "_(Consider: What problem does your idea solve? Is your idea feasible?)"
        - key: maxlength
          value: 1000
        - key: required
          value: true
    - prompt: _(How does your idea improve Cambridge? Who will benefit from your idea?)
      type: textarea
      name: impact
      optional: false
      attrs:
        - key: placeholder
          value: "_(Consider: What is the impact of your idea?)"
        - key: maxlength
          value: 1000
        - key: required
          value: true
    - prompt: _(Pick a category for your idea)
      name: location_type
      type: radiogroup
      options:
        - label: _(Community Resources)
          value: community_resources
        - label: _(Environment)
          value: environment_and_sustainability
        - label: _(Facilities, Parks & Recreation)
          value: parks_and_recreation
        - label: _(Transportation, Streets & Sidewalks)
          value: transpo_streets_and_sidewalks
      attrs:
        - key: required
          value: true

    - prompt: _(Your Name (required, will be shown on the map))
      help_text: _((This will be made available to the public. You can use an anonymous name if you would like.))
      type: text
      name: submitter_name
      sticky: true
      optional: false
      attrs:
        - key: size
          value: 30
        - key: required
          value: true
    - prompt: _(Your Email (optional, will NOT be shown on the map))
      type: email
      name: private-email
      sticky: true
      attrs:
        - key: size
          value: 30
    - prompt: _(Your Phone Number (optional, will NOT be shown on the map))
      type: tel
      name: private-phone
      sticky: true
      attrs:
        - key: size
          value: 30

    - prompt: _(Where are you submitting this idea from?)
      type: radiogroup
      name: private-submission_venue
      required: false
      optional: true
      options:
        - label: _(Community Event)
          value: community_event
        - label: _(School activity)
          value: school_activity
        - label: _(Community organization activity)
          value: community_organization_activity
        - label: _(Youth Center activity)
          value: youth_center_activity
        - label: _(Other)
          value: other
          other: true
    - prompt: _(Check any of the following that apply to you:)
      type: checkboxgroup
      name: private-personal_characteristics
      required: false
      optional: true
      sticky: true
      options:
        - label: _(I am a student in Cambridge (elementary, middle, or high school))
          value: pre_university_student
        - label: _(I am a university student in Cambridge)
          value: university_student
        - label: _(I work/go to school in Cambridge, but do not live in Cambridge)
          value: non_resident
        - label: _(I recently moved to Cambridge (0-2 years ago))
          value: recent_resident
        - label: _(I have lived in Cambridge for more than 2 years)
          value: long_time_resident
        - label: _(I know a lot about the City of Cambridge)
          value: city_knowledge
        - label: _(I have participated in PB before (submitted an idea, volunteered, and/or voted))
          value: previous_participant
        - label: _(I speak multiple languages)
          value: multilingual

survey:
  submission_type: comments
  adding_supported:
    from: '2024-08-26 00:00 -0400'   # Daylight savings begins mid-March
    until: '2024-10-02 00:00 -0400'  # and ends early-November.

  # Response config
  show_responses: true
  response_name: _(comment)
  response_plural_name: _(comments)
  action_text: _(commented on)
  anonymous_name: _(Someone)

  # Survey form config
  title: _(Leave a Comment)
  form_link_text: _(Leave a Comment)
  submit_btn_text: _(Comment)
  items:
    - prompt: _(Comment)
      label: _(Comment)
      type: textarea
      name: comment
    - prompt: _(Your Name)
      type: text
      name: submitter_name

support:
  submission_type: support
  adding_supported:
    from: '2024-08-26 00:00 -0400'   # Daylight savings begins mid-March
    until: '2024-10-02 00:00 -0400'  # and ends early-November.
  submit_btn_text: _(Support This!)
  response_name: _(support)
  response_plural_name: _(supports)
  action_text: _(supported)
  anonymous_name: _(Someone)

pages:
  - title: _(Cambridge PB Home)
    external: true
    url: http://pb.cambridgema.gov/
    link_attrs:
      target: _blank
  - title: _(Overview)
    slug: overview
    name: overview
    start_page: true
  - title: Filter Ideas
    slug: filter-type
    pages:
      - title: All
        external: true
        url: /filter/all
      - title: _(Community Resources)
        url: /filter/community_resources
        external: true
      - title: _(Environment)
        url: /filter/environment_and_sustainability
        external: true
      - title: _(Facilities, Parks & Recreation)
        url: /filter/parks_and_recreation
        external: true
      - title: _(Transportation, Streets & Sidewalks)
        url: /filter/transpo_streets_and_sidewalks
        external: true

